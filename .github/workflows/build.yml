name: Build PS3 PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps3dev/ps3dev:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PKG
        run: |
          echo "PSL1GHT=$PSL1GHT"
          echo "ps3dev=$PS3DEV"
          make -j$(nproc) pkg
          ls -lh *.pkg || ls -lh *.elf || true
          ls -lh EBOOT.BIN || true

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: stalker_demo-ps3-pkg
          path: stalker_demo.pkg
          if-no-files-found: error

      - name: Upload ELF for RPCS3
        uses: actions/upload-artifact@v4
        with:
          name: stalker_demo-elf
          path: "*.elf"
          if-no-files-found: warn
