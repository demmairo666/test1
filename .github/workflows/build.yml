name: Build PS3 PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y wget tar make python3 git autoconf automake bison flex libtool pkg-config

      - name: Download ps3dev prebuilt
        run: |
          wget -q https://github.com/ps3dev/ps3dev/releases/download/nightly-2026-07-26/ps3dev-linux-X64.tar.gz -O /tmp/ps3dev.tar.gz
          rm -rf /tmp/ps3dev_extract
          mkdir -p /tmp/ps3dev_extract
          tar -xzf /tmp/ps3dev.tar.gz -C /tmp/ps3dev_extract
          sudo mkdir -p /usr/local/ps3dev
          if [ -d /tmp/ps3dev_extract/ps3dev ]; then sudo cp -a /tmp/ps3dev_extract/ps3dev/* /usr/local/ps3dev/; else sudo cp -a /tmp/ps3dev_extract/* /usr/local/ps3dev/; fi
          ls -lh /usr/local/ps3dev

      - name: Build RSXGL
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH
          git clone https://github.com/ps3dev/RSXGL.git /tmp/RSXGL
          cd /tmp/RSXGL
          make -j$(nproc)
          sudo make install
          ls -lh /usr/local/ps3dev/portlibs/ppu/lib/libRSXGL* || ls -lh /usr/local/ps3dev/lib/*RSXGL* || echo "RSXGL not found list"
          find /usr/local/ps3dev -name "*RSXGL*" | head -n 20

      - name: Build raylib for PS3
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH
          git clone https://github.com/nbe1233/raylib-ps3.git /tmp/raylib-ps3
          cd /tmp/raylib-ps3/src
          make PLATFORM=PLATFORM_PSL1GHT -j$(nproc)
          sudo cp libraylib.a /usr/local/ps3dev/portlibs/ppu/lib/
          sudo cp raylib.h /usr/local/ps3dev/portlibs/ppu/include/
          sudo cp raymath.h /usr/local/ps3dev/portlibs/ppu/include/ || true
          ls -lh /usr/local/ps3dev/portlibs/ppu/lib/libraylib.a
          ls -lh /usr/local/ps3dev/portlibs/ppu/include/raylib.h

      - name: Build PKG
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH
          make -j$(nproc) V=1
          ls -lh *.elf *.self 2>&1 | head -n 20
          make pkg V=1
          ls -lh *.pkg 2>&1 | head -n 20

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: stalker_demo-ps3-pkg
          path: "*.pkg"
          if-no-files-found: error
